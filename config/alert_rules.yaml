alerts:
  - name: ChatAvailabilityDegraded
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: "#day13-llmops-alerts"
    owner: LLM Ops on-call
    runbook: docs/alerts.md#alert-1-chat-availability-degraded

  - name: ChatLatencySLOBreach
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 10m
    type: symptom-based
    channel: "#day13-llmops-alerts"
    owner: LLM Ops on-call
    runbook: docs/alerts.md#alert-2-chat-latency-slo-breach

  - name: RetrievalSuccessDegraded
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 5m
    type: symptom-based
    channel: "#day13-llmops-alerts"
    owner: Retrieval on-call
    runbook: docs/alerts.md#alert-3-retrieval-success-degraded
